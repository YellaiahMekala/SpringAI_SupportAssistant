name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: target/evaluation-report.md
          if-no-files-found: ignore

      - name: Build application image
        run: docker build -t enterprise-spring-ai-support-assistant:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build for production
        run: npm run build

      - name: Build web image
        run: docker build -t enterprise-spring-ai-support-assistant-web:ci .
